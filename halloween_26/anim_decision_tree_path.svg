<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="One frame walks down the tree"><title>One frame walks down the tree</title><rect width="800" height="450" fill="#fff4e0"/><text x="400.0" y="38" font-size="24" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One frame walks down the tree</text><rect x="20" y="70" width="215" height="130" fill="white" stroke="#ff8a1f" stroke-width="3" rx="12"/><text x="34" y="98" font-size="18" fill="#2e1f5e" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Your frame:</text><text x="34" y="128" font-size="16" fill="#2e1f5e" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">obstacle_dist = 150</text><text x="34" y="156" font-size="16" fill="#2e1f5e" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">obstacle_lane = 1</text><text x="34" y="184" font-size="16" fill="#2e1f5e" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">player_lane = 1</text><line x1="480" y1="130" x2="390" y2="205" stroke="#2e1f5e" stroke-width="4" stroke-linecap="round"><animate attributeName="stroke" values="#2e1f5e;#2e1f5e;#ff8a1f;#ff8a1f;#2e1f5e" keyTimes="0;0.4;0.475;0.95;1" dur="8s" repeatCount="indefinite"/></line><text x="410" y="160" font-size="16" fill="#0f8b8d" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">YES</text><line x1="560" y1="130" x2="640" y2="215" stroke="#2e1f5e" stroke-width="4" stroke-linecap="round"/><text x="630" y="160" font-size="16" fill="#c25e00" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">NO</text><line x1="350" y1="265" x2="300" y2="340" stroke="#2e1f5e" stroke-width="4" stroke-linecap="round"><animate attributeName="stroke" values="#2e1f5e;#2e1f5e;#ff8a1f;#ff8a1f;#2e1f5e" keyTimes="0;0.725;0.8;0.95;1" dur="8s" repeatCount="indefinite"/></line><text x="305" y="300" font-size="16" fill="#0f8b8d" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">YES</text><line x1="430" y1="265" x2="485" y2="340" stroke="#2e1f5e" stroke-width="4" stroke-linecap="round"/><text x="480" y="300" font-size="16" fill="#c25e00" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">NO</text><rect x="405.0" y="70.0" width="230" height="60" fill="#e4dcff" stroke="#2e1f5e" stroke-width="3" rx="12"><animate attributeName="fill" values="#e4dcff;#e4dcff;#ffcf7a;#ffcf7a;#e4dcff" keyTimes="0;0.263;0.275;0.95;1" dur="8s" repeatCount="indefinite"/></rect><text x="520" y="95.0" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Is obstacle_dist</text><text x="520" y="117.0" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">less than 200?</text><rect x="280.0" y="205.0" width="220" height="60" fill="#e4dcff" stroke="#2e1f5e" stroke-width="3" rx="12"><animate attributeName="fill" values="#e4dcff;#e4dcff;#ffcf7a;#ffcf7a;#e4dcff" keyTimes="0;0.512;0.525;0.95;1" dur="8s" repeatCount="indefinite"/></rect><text x="390" y="230.0" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Is obstacle_lane the</text><text x="390" y="252.0" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">same as player_lane?</text><rect x="575.0" y="215.0" width="170" height="60" fill="#c9f0ee" stroke="#0f8b8d" stroke-width="3" rx="12"/><text x="660" y="240.0" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Far away.</text><text x="660" y="262.0" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">STAY</text><rect x="195.0" y="340.0" width="190" height="60" fill="#c9f0ee" stroke="#ff8a1f" stroke-width="3" rx="12"><animate attributeName="fill" values="#c9f0ee;#c9f0ee;#ffcf7a;#ffcf7a;#c9f0ee" keyTimes="0;0.838;0.85;0.95;1" dur="8s" repeatCount="indefinite"/></rect><text x="290" y="365.0" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Danger!</text><text x="290" y="387.0" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">DODGE left or right</text><rect x="405.0" y="340.0" width="200" height="60" fill="#c9f0ee" stroke="#0f8b8d" stroke-width="3" rx="12"/><text x="505" y="365.0" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Different lane.</text><text x="505" y="387.0" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">STAY</text><g ><circle cx="0" cy="0" r="14" fill="#ff8a1f" stroke="#2e1f5e" stroke-width="3"/><text x="0" y="6" font-size="16" fill="#2e1f5e" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">F</text><animateTransform attributeName="transform" type="translate" values="120 215;120 215;480 130;480 130;390 205;390 205;350 265;350 265;300 340;300 340;120 215;120 215" keyTimes="0;0.125;0.275;0.4;0.525;0.625;0.725;0.738;0.85;0.95;0.988;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.062;0.95;0.988;1" dur="8s" repeatCount="indefinite"/></g><text x="400" y="430" font-size="22" fill="#c25e00" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Answer: DODGE<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.838;0.887;0.95;0.988;1" dur="8s" repeatCount="indefinite"/></text></svg>